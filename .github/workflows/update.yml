name: Update debthin indexes

# NOTE: GitHub disables `schedule:` workflows after 60 days with no repo
# activity (this happened on ~2026-05-30 and froze the indexes for months,
# with no notification beyond an email to the repo owner). The `push:` trigger
# below both republishes on config changes and resets that inactivity clock
# whenever anyone commits. If the repo goes quiet for 60 days it can still be
# disabled - check `gh workflow list --all` for `disabled_inactivity`.
on:
  schedule:
    - cron: "0 4 * * *"   # daily index update
    - cron: "0 3 * * 0"   # weekly re-curation on Sundays
  push:
    branches: [main]
    paths:
      - config.json
      - required_packages/**
      - scripts/debthin/**
      - .github/workflows/update.yml
  workflow_dispatch:
    inputs:
      force_recurate:
        description: "Re-run curation from popcon"
        type: boolean
        default: false

concurrency:
  group: update-indexes
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Get week number (for cache key)
        id: week
        run: echo "week=$(date +%Y-%V)" >> $GITHUB_OUTPUT

      - name: Restore package cache
        uses: actions/cache@v5
        with:
          path: cached/
          key: packages-${{ runner.os }}-${{ steps.week.outputs.week }}
          restore-keys: packages-${{ runner.os }}-

      - name: Import GPG key
        env:
          GPG_PRIVATE_KEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
        run: |
          echo "$GPG_PRIVATE_KEY" | gpg --batch --import
          echo "$GPG_KEY_ID:6:" | gpg --import-ownertrust

      - name: Re-curate package list
        if: >
          github.event.inputs.force_recurate == 'true' ||
          (github.event_name == 'schedule' && github.event.schedule == '0 3 * * 0')
        run: |
          python3 scripts/debthin/curate.py \
            --arch amd64



      - name: Install upload dependencies
        run: pip install boto3 --break-system-packages

      - name: Build, filter, sign, validate and upload indexes
        env:
          GPG_KEY_ID: ${{ secrets.GPG_KEY_ID }}
          PARALLEL: 8
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY: ${{ secrets.R2_ACCESS_KEY }}
          R2_SECRET_KEY: ${{ secrets.R2_SECRET_KEY }}
          R2_BUCKET: ${{ secrets.R2_BUCKET }}
        run: |
          bash scripts/debthin/build.sh

      # Confirms the build users actually receive, not just the one we produced.
      # A successful upload step is not proof: the 2026-05/09 outage served a
      # May index for months while every check upstream of the edge looked fine.
      - name: Verify live service is serving this build
        run: |
          for attempt in 1 2 3; do
            if python3 scripts/debthin/check_freshness.py --max-age-hours 6; then
              exit 0
            fi
            echo "attempt $attempt failed; retrying in 20s (edge propagation)" >&2
            sleep 20
          done
          echo "::error::live service is not serving a current build" >&2
          exit 1

      # Dead-man's switch. Everything above only runs when the workflow runs -
      # and the root cause of the 2026-05 outage was GitHub silently disabling
      # this workflow for inactivity, so nothing ran and nothing alerted for
      # ~3.5 months. An external monitor expecting a periodic ping is the only
      # thing that catches that. Optional: skipped when HEARTBEAT_URL is unset.
      - name: Ping heartbeat monitor
        if: success()
        env:
          HEARTBEAT_URL: ${{ secrets.HEARTBEAT_URL }}
        run: |
          if [[ -z "${HEARTBEAT_URL:-}" ]]; then
            echo "HEARTBEAT_URL not set - skipping (see README-DEBTHIN.md)"
            exit 0
          fi
          curl -fsS --max-time 20 --retry 3 "$HEARTBEAT_URL" > /dev/null
          echo "heartbeat pinged"
