name: Deploy workers

# Worker deploys were manual (`npx wrangler deploy`) until 2026-09. Because
# nothing enforced them, the edge ran February's bundle until September while
# config.json in main moved on - resolute was committed in June and never
# reached users. Deploying from CI on every relevant change removes that drift.
#
# config.json is a trigger path because workers/core/config.js imports it, so
# the debthin worker bundles it at build time: a config change is a worker
# change, not only a pipeline change.
on:
  push:
    branches: [main]
    paths:
      - workers/**
      - config.json
      - .github/workflows/deploy-workers.yml
  workflow_dispatch:

concurrency:
  group: deploy-workers
  cancel-in-progress: false

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Run worker unit tests
        run: node --test "workers/tests/unit/*.test.js"

  deploy:
    needs: test
    runs-on: ubuntu-latest
    strategy:
      # Deploy serially: all three share an account, and a partial failure is
      # easier to read when the configs are not racing each other.
      max-parallel: 1
      fail-fast: false
      matrix:
        include:
          - { name: debthin, config: wrangler.toml }
          - { name: images,  config: wrangler-images.toml }
          - { name: proxy,   config: wrangler-proxy.toml }
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v5
        with:
          node-version: "22"
      - name: Deploy ${{ matrix.name }}
        working-directory: workers
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CF_WORKER_TOKEN }}
        run: npx wrangler deploy -c ${{ matrix.config }}

  verify:
    needs: deploy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      # The debthin worker bundles config.json, so the config it serves is
      # proof of which bundle is actually live at the edge. A green deploy
      # step alone is not - that was the lesson from the index pipeline.
      - name: Verify edge is serving this commit's config
        run: |
          for attempt in 1 2 3; do
            if python3 - <<'PY'
          import json, sys, urllib.request
          url = "http://debthin.org/config.json"
          req = urllib.request.Request(url, headers={"User-Agent": "debthin-deploy-verify"})
          with urllib.request.urlopen(req, timeout=30) as r:
              served = json.loads(r.read().decode())
          local = json.load(open("config.json"))
          if served == local:
              suites = sorted(served.get("ubuntu", {}).get("suites", {}))
              print(f"OK: edge config matches this commit ({len(suites)} ubuntu suites)")
              sys.exit(0)
          for distro in sorted(set(served) | set(local)):
              s = set((served.get(distro) or {}).get("suites") or {})
              l = set((local.get(distro) or {}).get("suites") or {})
              if s != l:
                  print(f"  {distro}: only-at-edge={sorted(s - l)} only-in-repo={sorted(l - s)}", file=sys.stderr)
          print("MISMATCH: edge is not serving this commit's config", file=sys.stderr)
          sys.exit(1)
          PY
            then
              exit 0
            fi
            echo "attempt $attempt failed; retrying in 20s (edge propagation)" >&2
            sleep 20
          done
          echo "::error::edge did not pick up this commit's config" >&2
          exit 1
